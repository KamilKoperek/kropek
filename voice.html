<!doctype html>
<html lang="pl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kropek – głos</title>
<style>
  .top { display: flex; gap: 1rem; flex-wrap: wrap; align-items: stretch; }
  .state { flex: 1 1 14rem; display: flex; flex-direction: column; justify-content: center; font-size: 2.2rem; font-weight: 800; text-align: center; letter-spacing: .04em; transition: background .15s, color .15s; }
  .state.on { background: var(--speech); color: #052e1c; border-color: transparent; box-shadow: 0 0 40px rgba(52, 211, 153, .35); }
  .state small { display: block; font-size: .9rem; font-weight: 500; color: inherit; opacity: .8; font-family: var(--mono); }
  .meters { flex: 2 1 22rem; display: grid; gap: .8rem; align-content: center; }
  .meter { display: grid; grid-template-columns: 4.5rem 1fr 4.5rem; align-items: center; gap: .7rem; }
  .meter > span:first-child { color: var(--muted); font-size: .85rem; text-transform: uppercase; letter-spacing: .06em; }
  .bar { height: .9rem; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 999px; }
  .num { text-align: right; font-family: var(--mono); }
  canvas { display: block; width: 100%; height: 200px; background: var(--surface-2); border-radius: 10px; }
  .legend { color: var(--muted); font-size: .85rem; margin-top: .6rem; }
  .legend b { display: inline-block; width: .8rem; height: .8rem; border-radius: .2rem; vertical-align: -1px; margin: 0 .3rem 0 .9rem; }
  table { border-collapse: collapse; width: 100%; font-family: var(--mono); font-size: .9rem; }
  td, th { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font: 600 .75rem system-ui, sans-serif; text-transform: uppercase; letter-spacing: .08em; }
</style>
<link rel="stylesheet" href="ui.css">
<header class="topbar"><nav>
  <a class="brand" href="settings.html">Kropek</a>
  <a href="voice.html" aria-current="page">Głos</a><a href="config.php">Ustawienia</a><a href="deploy.php">Wdrożenie</a><a class="nuke-link" href="nuke.php">Nuke</a>
</nav></header>
<main>
<h1>Aktywność głosu</h1>
<p class="status" id="status">łączenie…</p>
<div class="top">
  <div class="state card" id="state">cisza<small id="stateSub">&nbsp;</small></div>
  <div class="meters card">
    <div class="meter"><span>VAD</span><div class="bar"><i id="vadBar" style="background:var(--vad)"></i></div><span class="num" id="vadNum">–</span></div>
    <div class="meter"><span>Mowa</span><div class="bar"><i id="spBar" style="background:var(--speech)"></i></div><span class="num" id="spNum">–</span></div>
    <div class="meter"><span>Poziom</span><div class="bar"><i id="lvBar" style="background:var(--level)"></i></div><span class="num" id="lvNum">–</span></div>
  </div>
</div>
<div class="card" style="margin-top:1rem">
  <canvas id="chart" aria-label="Ostatnie 10 sekund: prawdopodobieństwo VAD i poziom sygnału"></canvas>
  <div class="legend">ostatnie 10 s <b style="background:var(--vad)"></b>VAD <b style="background:var(--level)"></b>poziom (−90…0 dB) <b style="background:var(--speech);opacity:.25"></b>fragment mowy</div>
</div>
<h2>Fragmenty mowy</h2>
<div class="card"><table><thead><tr><th>Początek</th><th>Czas trwania</th><th>Szczyt VAD</th></tr></thead><tbody id="log"></tbody></table></div>
</main>
<script>
const POLL_MS = 50, FRAME_MS = 10, HISTORY = 1000;            // 1000 frames = 10 s
const ON = 0.6, OFF = 0.3, HANG = 30;                         // hysteresis; 30 frames = 300 ms hangover
const SCALE = 0.5;                                            // chart drawn at half resolution, upscaled by CSS
const MAX_LAG = 25;                                           // >250 ms queued -> catch up instead of drifting
const $ = id => document.getElementById(id);
const hist = [], queue = [];                                  // hist: {vad, sp, db, speech}
let lastSeq = 0, speaking = false, quiet = 0, seg = null, colors = null;

function onFrame([vad, sp, db]) {
  if (!speaking && vad >= ON) { speaking = true; quiet = 0; seg = { start: new Date(), frames: 0, peak: 0 }; }
  if (speaking) {
    seg.frames++; seg.peak = Math.max(seg.peak, vad);
    quiet = vad < OFF ? quiet + 1 : 0;
    if (quiet >= HANG) { speaking = false; logSegment(seg, seg.frames - HANG); seg = null; }
  }
  hist.push({ vad, sp, db, speech: speaking });
  if (hist.length > HISTORY) hist.shift();
}

function logSegment(s, frames) {
  const tr = document.createElement('tr');
  for (const v of [s.start.toLocaleTimeString(), (frames * FRAME_MS / 1000).toFixed(2) + ' s', s.peak.toFixed(2)]) {
    const td = document.createElement('td'); td.textContent = v; tr.appendChild(td);
  }
  const log = $('log'); log.prepend(tr);
  while (log.children.length > 50) log.lastChild.remove();
}

const shown = {};
function setText(id, v) { if (shown[id] !== v) { shown[id] = v; $(id).textContent = v; } }
function setWidth(id, pct) { const v = pct.toFixed(1) + '%'; if (shown[id] !== v) { shown[id] = v; $(id).style.width = v; } }

function render() {
  const f = hist[hist.length - 1];
  if (f) {
    setWidth('vadBar', f.vad * 100); setText('vadNum', f.vad.toFixed(2));
    setWidth('spBar', f.sp); setText('spNum', f.sp.toFixed(0) + '%');
    setWidth('lvBar', (f.db + 90) / 90 * 100); setText('lvNum', f.db.toFixed(0) + ' dB');
  }
  const st = $('state'), cls = 'state card' + (speaking ? ' on' : '');
  if (st.className !== cls) { st.className = cls; st.firstChild.textContent = speaking ? 'MOWA' : 'cisza'; }
  setText('stateSub', speaking ? (seg.frames * FRAME_MS / 1000).toFixed(1) + ' s' : ' ');
  drawChart();
}

function drawChart() {
  const c = $('chart');
  const w = Math.max(1, Math.round(c.clientWidth * SCALE)), h = Math.max(1, Math.round(c.clientHeight * SCALE));
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  if (!colors) {
    const css = getComputedStyle(document.documentElement);
    colors = { speech: css.getPropertyValue('--speech'), vad: css.getPropertyValue('--vad'), level: css.getPropertyValue('--level') };
  }
  const g = c.getContext('2d'); g.clearRect(0, 0, w, h);
  // one column per canvas pixel: max of the frames that fall into it
  const cols = [], off = HISTORY - hist.length;
  hist.forEach((f, i) => {
    const x = Math.floor((i + off) / HISTORY * w), col = cols[x];
    if (!col) cols[x] = { vad: f.vad, lv: (f.db + 90) / 90, speech: f.speech };
    else { col.vad = Math.max(col.vad, f.vad); col.lv = Math.max(col.lv, (f.db + 90) / 90); col.speech ||= f.speech; }
  });
  g.fillStyle = colors.speech; g.globalAlpha = .25;
  cols.forEach((col, x) => { if (col.speech) g.fillRect(x, 0, 1, h); });
  g.globalAlpha = 1; g.lineWidth = 1;
  for (const [color, key] of [[colors.level, 'lv'], [colors.vad, 'vad']]) {
    g.strokeStyle = color; g.beginPath(); let first = true;
    cols.forEach((col, x) => { const y = h - col[key] * (h - 2) - 1; first ? g.moveTo(x, y) : g.lineTo(x, y); first = false; });
    g.stroke();
  }
}

// feed queued frames at real time (10 ms each) on every animation frame -> smooth scrolling
let lastT = null, due = 0;
function tick(t) {
  if (lastT !== null) due += (t - lastT) / FRAME_MS;
  lastT = t;
  let n = Math.min(queue.length, Math.floor(due));
  if (queue.length - n > MAX_LAG) n = queue.length - MAX_LAG / 2;
  due = queue.length ? due - Math.floor(due) : 0;
  if (n > 0) { queue.splice(0, n).forEach(onFrame); render(); }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

async function poll() {
  try {
    const d = await (await fetch('vad.php', { cache: 'no-store' })).json();
    if (d.age === null || d.age > 2) {
      setText('status', 'brak danych z usługi mikrofonu (kiosk-vad)'); $('status').className = 'status bad';
    } else {
      setText('status', 'na żywo'); $('status').className = 'status ok';
      if (d.seq < lastSeq) lastSeq = 0;                       // service restarted
      const fresh = Math.min(d.seq - lastSeq, d.frames.length);
      queue.push(...d.frames.slice(d.frames.length - fresh));
      lastSeq = d.seq;
    }
  } catch (e) {
    setText('status', 'serwer nieosiągalny'); $('status').className = 'status bad';
  }
  setTimeout(poll, POLL_MS);
}
poll();
</script>
</html>
